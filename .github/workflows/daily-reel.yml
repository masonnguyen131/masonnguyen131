name: Daily reel

# Every morning in Melbourne: reprint the terminal and re-cut the contribution reel.
on:
  schedule:
    - cron: "0 19 * * *" # 06:00 AEDT / 05:00 AEST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reprint the terminal
        run: python3 scripts/terminal.py dist

      - name: Cut the contribution reel
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/reel-light.svg?color_snake=#4F2BFF&color_dots=#EBEDF0,#D9D0FF,#B3A4FF,#7F66FF,#4F2BFF
            dist/reel-dark.svg?color_snake=#8F7BFF&color_dots=#151B23,#2A2347,#3F3192,#5E45E0,#8F7BFF&color_dot_border=#0D1117

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
