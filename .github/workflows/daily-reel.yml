name: Daily reel

# Every morning in Melbourne: print a fresh call sheet and re-cut the contribution reel.
on:
  schedule:
    - cron: "0 19 * * *" # 06:00 AEDT / 05:00 AEST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Print the call sheet
        run: python3 scripts/callsheet.py dist

      - name: Cut the contribution reel
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/reel-light.svg?color_snake=#FF5B1F&color_dots=#E6E0D4,#EBC3AA,#F3A07A,#FA7A47,#FF5B1F
            dist/reel-dark.svg?color_snake=#FF5B1F&color_dots=#1A1A1C,#3B241B,#6E3016,#B54217,#FF5B1F&color_dot_border=#0A0A0B

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
