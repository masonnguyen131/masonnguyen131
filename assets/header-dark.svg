<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Mason Nguyen: Applied AI and automation for finance teams</title>
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <text x="450.0" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">Mason Nguyen</text>
    <text x="450.0" y="114" text-anchor="middle" font-size="17" fill="#9198A1">Applied AI and automation for finance teams</text>
  </g>
  <line x1="210" y1="172" x2="690" y2="172" stroke="#3D444D" stroke-width="2" stroke-linecap="round"/>
