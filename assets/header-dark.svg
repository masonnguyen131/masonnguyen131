    <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite"
             keyTimes="0;0.75;0.92;1" values="0.55;0.55;0;0"/>
  </line>
    <circle cx="210.0" cy="172" r="7" fill="none" stroke="#4493F8" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.12;1" values="0.9;0;0"/>
      <animate attributeName="r" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.12;1" values="7;16;16"/>
    </circle>
    <circle cx="210.0" cy="172" r="6" fill="#0D1117" stroke="#4493F8" stroke-width="2"/>
    <text x="210.0" y="204" text-anchor="middle" font-size="13" fill="#9198A1" letter-spacing="0.3">Discover</text>
    <circle cx="370.0" cy="172" r="7" fill="none" stroke="#4493F8" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.240;0.250;0.370;1" values="0;0;0.9;0;0"/>
      <animate attributeName="r" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.240;0.250;0.370;1" values="7;7;7;16;16"/>
    </circle>
    <circle cx="370.0" cy="172" r="6" fill="#0D1117" stroke="#4493F8" stroke-width="2"/>
    <text x="370.0" y="204" text-anchor="middle" font-size="13" fill="#9198A1" letter-spacing="0.3">Design</text>
    <circle cx="530.0" cy="172" r="7" fill="none" stroke="#4493F8" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.490;0.500;0.620;1" values="0;0;0.9;0;0"/>
      <animate attributeName="r" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.490;0.500;0.620;1" values="7;7;7;16;16"/>
    </circle>
    <circle cx="530.0" cy="172" r="6" fill="#0D1117" stroke="#4493F8" stroke-width="2"/>
    <text x="530.0" y="204" text-anchor="middle" font-size="13" fill="#9198A1" letter-spacing="0.3">Deploy</text>
    <circle cx="690.0" cy="172" r="7" fill="none" stroke="#4493F8" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.740;0.750;0.870;1" values="0;0;0.9;0;0"/>
      <animate attributeName="r" dur="6.0s" repeatCount="indefinite" keyTimes="0;0.740;0.750;0.870;1" values="7;7;7;16;16"/>
    </circle>
    <circle cx="690.0" cy="172" r="6" fill="#0D1117" stroke="#4493F8" stroke-width="2"/>
    <text x="690.0" y="204" text-anchor="middle" font-size="13" fill="#9198A1" letter-spacing="0.3">Measure</text>
  <circle r="4" fill="#4493F8">
    <animateMotion dur="6.0s" repeatCount="indefinite" calcMode="linear"
                   keyTimes="0;0.75;1" keyPoints="0;1;1" path="M210,172 L690,172"/>
    <animate attributeName="opacity" dur="6.0s" repeatCount="indefinite"
